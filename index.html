<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collage Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg id="svg-filters" xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;pointer-events:none"><defs></defs></svg>

  <div class="app">
    <header class="navbar">
      <div class="navbar-left">
        <div class="logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
          <span>COLLAGE<b>STUDIO</b></span>
        </div>
        <span class="badge" id="canvas-info">0 images</span>
      </div>
      <div class="navbar-center">
        <div class="tool-item">
          <span class="tool-label">RATIO</span>
          <select id="aspect-ratio">
            <option value="16:9" selected>16 : 9</option>
            <option value="21:9">21 : 9</option>
            <option value="4:3">4 : 3</option>
            <option value="3:2">3 : 2</option>
            <option value="1:1">1 : 1</option>
            <option value="9:16">9 : 16</option>
            <option value="3:4">3 : 4</option>
          </select>
        </div>
        <div class="tool-divider"></div>
        <div class="tool-item">
          <span class="tool-label">GAP</span>
          <input type="range" id="collage-gap" min="0" max="40" value="10" class="figma-slider">
          <input type="number" id="gap-num" min="0" max="40" value="10" class="val-num-input">
        </div>
        <div class="tool-divider"></div>
        <div class="tool-item">
          <span class="tool-label">RADIUS</span>
          <input type="range" id="border-radius" min="0" max="36" value="10" class="figma-slider">
          <input type="number" id="radius-num" min="0" max="36" value="10" class="val-num-input">
        </div>
        <div class="tool-divider"></div>
        <div class="tool-item">
          <span class="tool-label">TAG</span>
          <input type="range" id="tag-size" min="12" max="32" value="18" class="figma-slider">
          <input type="number" id="tag-size-num" min="12" max="32" value="18" class="val-num-input">
        </div>
        <div class="tool-divider"></div>
        <div class="tool-item">
          <span class="tool-label">FRAME</span>
          <input type="color" id="frame-color" value="#ffffff" class="color-picker">
          <span class="tool-val" id="frame-color-val">#FFF</span>
        </div>
        <div class="tool-divider"></div>
        <div class="tool-item">
          <span class="tool-label">STROKE</span>
          <input type="range" id="frame-stroke" min="1" max="8" value="3" class="figma-slider">
          <input type="number" id="frame-stroke-num" min="1" max="8" value="3" class="val-num-input">
        </div>
      </div>
      <div class="navbar-right">
        <a href="https://t.me/camtarssonai" target="_blank" rel="noopener noreferrer" class="btn btn-tg" title="Telegram Channel">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
          <span>@camtarssonai</span>
        </a>
        <button class="btn btn-secondary" id="btn-clear-canvas">Clear</button>
        <button class="btn btn-primary" id="btn-export">Export</button>
      </div>
    </header>

    <div class="studio-body">
      <main class="canvas-viewport" id="canvas-viewport">
        <!-- Canvas frame: explicit pixel w/h set by JS -->
        <div class="canvas-frame" id="collage-wrapper">
          <!-- Collage rendered as absolutely-positioned children -->
          <div class="collage-canvas" id="collage"></div>
          <div class="empty-canvas" id="empty-state">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
            <h3>Drop images or click from library</h3>
          </div>
        </div>
      </main>

      <aside class="figma-sidebar">
        <section class="sidebar-section library-section">
          <div class="section-header">
            <div class="section-title">ASSETS <span class="count-pill" id="lib-count">0</span></div>
            <div class="section-actions">
              <button class="icon-btn" id="btn-add-all" title="Add all">+</button>
              <button class="icon-btn danger" id="btn-clear-lib" title="Clear">×</button>
            </div>
          </div>
          <div class="upload-dropzone">
            <input type="file" id="file-input" multiple accept="image/*" hidden>
            <button class="btn btn-upload" id="btn-upload">Upload Images</button>
          </div>
          <div class="library-scroll">
            <div class="library-grid" id="library-grid"></div>
            <div class="library-empty" id="library-empty">No images yet</div>
          </div>
        </section>

        <section class="sidebar-section inspector-section" id="adjustments-panel" hidden>
          <div class="section-header border-top">
            <div class="section-title" id="adj-title">PROPERTIES</div>
            <button class="icon-btn" id="btn-deselect">×</button>
          </div>
          <div class="inspector-controls">
            <div class="prop-group">
              <div class="prop-row"><span class="prop-label">Brightness</span><div class="slider-val-box"><input type="range" id="adj-brightness" min="0" max="200" value="100" class="figma-slider"><input type="number" id="adj-brightness-num" min="0" max="200" value="100" class="val-num-input"></div></div>
              <div class="prop-row"><span class="prop-label">Contrast</span><div class="slider-val-box"><input type="range" id="adj-contrast" min="0" max="200" value="100" class="figma-slider"><input type="number" id="adj-contrast-num" min="0" max="200" value="100" class="val-num-input"></div></div>
            </div>
            <div class="prop-group">
              <div class="prop-row"><span class="prop-label color-r">Red</span><div class="slider-val-box"><input type="range" id="adj-r" min="0" max="200" value="100" class="figma-slider slider-red"><input type="number" id="adj-r-num" min="0" max="200" value="100" class="val-num-input"></div></div>
              <div class="prop-row"><span class="prop-label color-g">Green</span><div class="slider-val-box"><input type="range" id="adj-g" min="0" max="200" value="100" class="figma-slider slider-green"><input type="number" id="adj-g-num" min="0" max="200" value="100" class="val-num-input"></div></div>
              <div class="prop-row"><span class="prop-label color-b">Blue</span><div class="slider-val-box"><input type="range" id="adj-b" min="0" max="200" value="100" class="figma-slider slider-blue"><input type="number" id="adj-b-num" min="0" max="200" value="100" class="val-num-input"></div></div>
            </div>
            <div class="prop-actions">
              <button class="btn btn-secondary btn-full" id="btn-reset-adj">Reset</button>
              <button class="btn btn-danger btn-full" id="btn-remove-cell">Delete</button>
            </div>
          </div>
        </section>
      </aside>
    </div>
  </div>

  <!-- EXPORT OPTIONS MODAL -->
  <div class="modal-overlay" id="export-modal" hidden>
    <div class="figma-modal">
      <div class="modal-header">
        <h2>Export Collage</h2>
        <button class="icon-btn" id="btn-modal-x">×</button>
      </div>

      <div class="export-form" id="export-form-step">
        <div class="form-group">
          <label class="form-label">RESOLUTION</label>
          <div class="preset-grid">
            <label class="preset-btn"><input type="radio" name="res-preset" value="3840"> <span>4K</span></label>
            <label class="preset-btn"><input type="radio" name="res-preset" value="7680" checked> <span>8K</span></label>
            <label class="preset-btn"><input type="radio" name="res-preset" value="9600"> <span>10K</span></label>
            <label class="preset-btn"><input type="radio" name="res-preset" value="15360"> <span>16K</span></label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">FORMAT</label>
          <div class="format-toggle">
            <label class="format-btn"><input type="radio" name="export-fmt" value="image/jpeg" checked> <span>JPEG</span></label>
            <label class="format-btn"><input type="radio" name="export-fmt" value="image/png"> <span>PNG</span></label>
          </div>
        </div>

        <button class="btn btn-primary btn-full btn-large" id="btn-start-export">Start Download</button>
      </div>

      <div class="export-progress-step" id="export-progress-step" hidden>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" id="export-progress"></div></div>
        <p class="modal-status" id="export-status">Building...</p>
        <button class="btn btn-primary btn-full" id="btn-close-modal" hidden>Done</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
