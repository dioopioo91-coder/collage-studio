<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Collage Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=44">
</head>
<body>
  <svg id="svg-filters" xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;pointer-events:none"><defs></defs></svg>

  <div class="app">
    <header class="navbar">
      <div class="navbar-left">
        <div class="logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
          <span>COLLAGE<b>STUDIO</b></span>
        </div>
        <div class="lang-switcher">
          <button class="lang-btn active" data-lang="ru">RU</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        <span class="badge" id="canvas-info">0 images</span>
      </div>
      <div class="navbar-center">
        <div class="drawer-handle"></div>
        <!-- RATIO: segment buttons on mobile, select on desktop -->
        <div class="tool-item tool-item-ratio">
          <span class="tool-label" data-i18n="ratio">ПРОПОРЦИИ</span>
          <select id="aspect-ratio" class="desktop-only-select">
            <option value="16:9" selected>16 : 9</option>
            <option value="21:9">21 : 9</option>
            <option value="4:3">4 : 3</option>
            <option value="3:2">3 : 2</option>
            <option value="1:1">1 : 1</option>
            <option value="9:16">9 : 16</option>
            <option value="3:4">3 : 4</option>
          </select>
          <div class="ratio-btn-grid" id="ratio-btn-grid">
            <button type="button" class="ratio-btn active" data-ratio="16:9">16:9</button>
            <button type="button" class="ratio-btn" data-ratio="21:9">21:9</button>
            <button type="button" class="ratio-btn" data-ratio="4:3">4:3</button>
            <button type="button" class="ratio-btn" data-ratio="3:2">3:2</button>
            <button type="button" class="ratio-btn" data-ratio="1:1">1:1</button>
            <button type="button" class="ratio-btn" data-ratio="9:16">9:16</button>
            <button type="button" class="ratio-btn" data-ratio="3:4">3:4</button>
          </div>
        </div>
        <div class="tool-divider"></div>
        <div class="tool-item prop-row-layout">
          <span class="tool-label" data-i18n="gap">ОТСТУП</span>
          <div class="slider-val-box"><input type="range" id="collage-gap" min="0" max="40" value="10" class="app-slider"><input type="number" id="gap-num" min="0" max="40" value="10" class="val-num-input"></div>
        </div>
        <div class="tool-divider"></div>
        <div class="tool-item prop-row-layout">
          <span class="tool-label" data-i18n="radius">СКРУГЛЕНИЕ</span>
          <div class="slider-val-box"><input type="range" id="border-radius" min="0" max="36" value="10" class="app-slider"><input type="number" id="radius-num" min="0" max="36" value="10" class="val-num-input"></div>
        </div>
        <div class="tool-divider"></div>
        <div class="tool-item prop-row-layout">
          <div class="tag-control-header">
            <label class="tool-toggle-label"><input type="checkbox" id="tag-enable" checked> <span class="tool-label" data-i18n="tag">ТЕГ</span></label>
            <div class="tag-mode-switch">
              <button type="button" class="tag-mode-btn active" id="btn-tag-mode-tag" data-tag-mode="tag" data-i18n="tagBadge">@ТЕГ</button>
              <button type="button" class="tag-mode-btn" id="btn-tag-mode-name" data-tag-mode="name" data-i18n="fileName">ИМЯ</button>
            </div>
          </div>
          <div class="slider-val-box"><input type="range" id="tag-size" min="12" max="32" value="18" class="app-slider"><input type="number" id="tag-size-num" min="12" max="32" value="18" class="val-num-input"></div>
        </div>
        <div class="tool-divider"></div>
        <div class="tool-item prop-row-layout">
          <label class="tool-toggle-label"><input type="checkbox" id="stroke-enable" checked> <span class="tool-label" data-i18n="stroke">РАМКА</span></label>
          <div class="stroke-row"><input type="color" id="frame-color" value="#ffffff" class="color-picker"><span class="tool-val" id="frame-color-val">#FFF</span></div>
          <div class="slider-val-box"><input type="range" id="frame-stroke" min="1" max="8" value="3" class="app-slider"><input type="number" id="frame-stroke-num" min="1" max="8" value="3" class="val-num-input"></div>
        </div>
      </div>
      <div class="navbar-right">
        <a href="https://telegram.me/camtarssonai" target="_blank" rel="noopener noreferrer" class="btn-tg" title="Telegram Channel">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
            <circle cx="18" cy="18" r="18" fill="#24A1DE"/>
            <path d="M8.5 17.5L26.5 10.5L23.5 25.5L17.5 21L14.5 24V19.5L23 13.5L12.5 18.5L8.5 17.5Z" fill="white" stroke="white" stroke-width="0.5" stroke-linejoin="round"/>
          </svg>
        </a>
        <button class="btn btn-secondary" id="btn-clear-canvas" data-i18n="clear">Очистить</button>
        <button class="btn btn-primary" id="btn-export" data-i18n="export">Экспорт</button>
        <button class="btn btn-primary mobile-export-btn" id="btn-export-mobile" title="Export">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
      </div>
    </header>

    <div class="studio-body">
      <main class="canvas-viewport" id="canvas-viewport">
        <!-- Floating Mode Switcher (Top Center) -->
        <div class="canvas-mode-switcher">
          <button class="canvas-mode-btn active" id="btn-mode-select" data-i18n="modeSelect">Фото</button>
          <button class="canvas-mode-btn" id="btn-mode-pan" data-i18n="modePan">Холст</button>
        </div>
        <!-- Canvas frame: explicit pixel w/h set by JS -->
        <div class="canvas-frame" id="collage-wrapper">
          <!-- Collage rendered as absolutely-positioned children -->
          <div class="collage-canvas" id="collage"></div>
          <label class="empty-canvas" id="empty-state" for="global-file-input">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
            <h3 data-i18n="emptyNotice">Перетащите фото или выберите из библиотеки</h3>
          </label>
        </div>

        <!-- Zoom & Pan Controls (Bottom Center) -->
        <div class="zoom-controls">
          <button class="icon-btn" id="btn-undo" title="Отменить (Ctrl+Z)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
          </button>
          <button class="icon-btn" id="btn-redo" title="Повторить (Ctrl+Y)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
          </button>
          <div class="tool-divider"></div>
          <button class="icon-btn active" id="btn-select-tool" title="Select Tool">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7 18 3-7 7-3L3 3z"/></svg>
          </button>
          <button class="icon-btn" id="btn-pan-tool" title="Pan Canvas">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v9"/><path d="M18 8a2 2 0 0 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
          </button>
          <div class="tool-divider"></div>
          <button class="icon-btn" id="btn-zoom-out" title="Zoom Out">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <span class="zoom-val" id="zoom-val">100%</span>
          <button class="icon-btn" id="btn-zoom-in" title="Zoom In">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <button class="icon-btn" id="btn-zoom-reset" title="Reset Zoom (100%)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
        </div>
      </main>

      <aside class="studio-sidebar">
        <div class="drawer-handle"></div>
        <section class="sidebar-section library-section">
          <div class="section-header">
            <div class="section-title"><span data-i18n="assets">АССЕТЫ</span> <span class="count-pill" id="lib-count">0</span></div>
            <div class="section-actions">
              <button class="icon-btn" id="btn-add-all" title="Add all">+</button>
              <button class="icon-btn danger" id="btn-clear-lib" title="Clear">×</button>
            </div>
          </div>
          <div class="upload-dropzone">
            <label class="btn btn-upload" id="btn-upload" for="global-file-input" data-i18n="upload">Загрузить фото</label>
          </div>
          <div class="library-scroll">
            <div class="library-grid" id="library-grid"></div>
            <div class="library-empty" id="library-empty" data-i18n="noImages">Нет изображений</div>
          </div>
        </section>

        <section class="sidebar-section inspector-section" id="adjustments-panel" hidden>
          <div class="drawer-handle"></div>
          <div class="section-header border-top">
            <div class="inspector-header-left">
              <span class="selected-tag-pill" id="inspector-tag-badge">@IMAGE 1</span>
              <div class="inspector-tabs">
                <button class="tab-btn active" data-tab="tab-color" data-i18n="tabColor">Цвет</button>
                <button class="tab-btn" data-tab="tab-lines" data-i18n="lines">Линии</button>
                <button class="tab-btn" data-tab="tab-noise" data-i18n="noise">Шум</button>
              </div>
            </div>
            <button class="icon-btn" id="btn-deselect" title="Закрыть">×</button>
          </div>
          <div class="inspector-controls">
            <!-- TAB 1: COLOR -->
            <div class="tab-content active" id="tab-color">
              <div class="prop-group">
                <div class="prop-row"><span class="prop-label" data-i18n="brightness">Яркость</span><div class="slider-val-box"><input type="range" id="adj-brightness" min="0" max="200" value="100" class="app-slider"><input type="number" id="adj-brightness-num" min="0" max="200" value="100" class="val-num-input"></div></div>
                <div class="prop-row"><span class="prop-label" data-i18n="contrast">Контраст</span><div class="slider-val-box"><input type="range" id="adj-contrast" min="0" max="200" value="100" class="app-slider"><input type="number" id="adj-contrast-num" min="0" max="200" value="100" class="val-num-input"></div></div>
              </div>
              <div class="prop-group">
                <div class="prop-row"><span class="prop-label color-r" data-i18n="red">Красный</span><div class="slider-val-box"><input type="range" id="adj-r" min="0" max="200" value="100" class="app-slider slider-red"><input type="number" id="adj-r-num" min="0" max="200" value="100" class="val-num-input"></div></div>
                <div class="prop-row"><span class="prop-label color-g" data-i18n="green">Зелёный</span><div class="slider-val-box"><input type="range" id="adj-g" min="0" max="200" value="100" class="app-slider slider-green"><input type="number" id="adj-g-num" min="0" max="200" value="100" class="val-num-input"></div></div>
                <div class="prop-row"><span class="prop-label color-b" data-i18n="blue">Синий</span><div class="slider-val-box"><input type="range" id="adj-b" min="0" max="200" value="100" class="app-slider slider-blue"><input type="number" id="adj-b-num" min="0" max="200" value="100" class="val-num-input"></div></div>
              </div>
            </div>

            <!-- TAB 2: LINES -->
            <div class="tab-content" id="tab-lines">
              <div class="effect-card">
                <div class="effect-header">
                  <label class="toggle-label"><input type="checkbox" id="lines-enable"> <span data-i18n="lines">Линии</span></label>
                  <div class="mode-segmented">
                    <button type="button" class="segment-btn active" id="lines-mode-full" onclick="setEffectMode('lines','full')" data-i18n="fullPhoto">Всё фото</button>
                    <button type="button" class="segment-btn" id="lines-mode-region" onclick="setEffectMode('lines','region')" data-i18n="selectedRegion">Выделенный участок</button>
                  </div>
                </div>
                <div class="effect-body" id="lines-body">
                  <div class="prop-row"><span class="prop-label" data-i18n="angle">Угол</span><div class="slider-val-box"><input type="range" id="lines-angle" min="0" max="180" value="0" class="app-slider"><input type="number" id="lines-angle-num" min="0" max="180" value="0" class="val-num-input"></div></div>
                  <div class="prop-row"><span class="prop-label" data-i18n="spacing">Отступ</span><div class="slider-val-box"><input type="range" id="lines-spacing" min="4" max="100" value="30" class="app-slider"><input type="number" id="lines-spacing-num" min="4" max="100" value="30" class="val-num-input"></div></div>
                  <div class="prop-row"><span class="prop-label" data-i18n="size">Размер</span><div class="slider-val-box"><input type="range" id="lines-size" min="1" max="20" value="2" class="app-slider"><input type="number" id="lines-size-num" min="1" max="20" value="2" class="val-num-input"></div></div>
                  <div class="prop-row"><span class="prop-label" data-i18n="opacity">Прозр.</span><div class="slider-val-box"><input type="range" id="lines-opacity" min="0" max="100" value="80" class="app-slider"><input type="number" id="lines-opacity-num" min="0" max="100" value="80" class="val-num-input"></div></div>
                  <div class="prop-row"><span class="prop-label" data-i18n="color">Цвет</span><div class="color-val-box"><input type="color" id="lines-color" value="#ffff00" class="color-picker-input"><span id="lines-color-hex" class="hex-val">#FFFF00</span></div></div>
                </div>
              </div>
            </div>

            <!-- TAB 3: NOISE -->
            <div class="tab-content" id="tab-noise">
              <div class="effect-card">
                <div class="effect-header">
                  <label class="toggle-label"><input type="checkbox" id="noise-enable"> <span data-i18n="noise">Шум</span></label>
                  <div class="mode-segmented">
                    <button type="button" class="segment-btn active" id="noise-mode-full" onclick="setEffectMode('noise','full')" data-i18n="fullPhoto">Всё фото</button>
                    <button type="button" class="segment-btn" id="noise-mode-region" onclick="setEffectMode('noise','region')" data-i18n="selectedRegion">Выделенный участок</button>
                  </div>
                </div>
                <div class="effect-body" id="noise-body">
                  <div class="prop-row"><span class="prop-label" data-i18n="level">Уровень</span><div class="slider-val-box"><input type="range" id="noise-amount" min="0" max="100" value="30" class="app-slider"><input type="number" id="noise-amount-num" min="0" max="100" value="30" class="val-num-input"></div></div>
                </div>
              </div>
            </div>

            <div class="prop-actions">
              <button class="btn btn-secondary" id="btn-reset-adj" data-i18n="reset">Reset</button>
              <button class="btn btn-danger" id="btn-remove-cell" data-i18n="delete">Delete</button>
            </div>
          </div>
        </section>
      </aside>
    </div>
  </div>

  <!-- EXPORT OPTIONS MODAL -->
  <div class="modal-overlay" id="export-modal" hidden>
    <div class="export-modal-window">
      <div class="modal-header">
        <h2 data-i18n="exportTitle">Экспорт коллажа</h2>
        <button class="icon-btn" id="btn-modal-x">×</button>
      </div>

      <div class="export-form" id="export-form-step">
        <div class="form-group">
          <label class="form-label" data-i18n="resolution">РАЗРЕШЕНИЕ</label>
          <div class="preset-grid">
            <label class="preset-btn"><input type="radio" name="res-preset" value="3840"> <span>4K</span></label>
            <label class="preset-btn"><input type="radio" name="res-preset" value="7680" checked> <span>8K</span></label>
            <label class="preset-btn"><input type="radio" name="res-preset" value="9600"> <span>10K</span></label>
            <label class="preset-btn"><input type="radio" name="res-preset" value="15360"> <span>16K</span></label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" data-i18n="format">ФОРМАТ</label>
          <div class="format-toggle">
            <label class="format-btn"><input type="radio" name="export-fmt" value="image/jpeg" checked> <span>JPEG</span></label>
            <label class="format-btn"><input type="radio" name="export-fmt" value="image/png"> <span>PNG</span></label>
          </div>
        </div>

        <button class="btn btn-primary btn-full btn-large" id="btn-start-export" data-i18n="startDownload">Скачать</button>
      </div>

      <div class="export-progress-step" id="export-progress-step" hidden>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" id="export-progress"></div></div>
        <p class="modal-status" id="export-status">Preparing...</p>
        <button class="btn btn-primary btn-full" id="btn-close-modal" data-i18n="done" hidden>Готово</button>
      </div>
    </div>
  </div>

  <!-- Fullscreen Photo Editor Overlay -->
  <div class="editor-mode-overlay" id="editor-mode-overlay" hidden>
    <header class="editor-header">
      <button class="btn-editor-back" id="btn-editor-close" title="Закрыть редактор">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <span class="editor-title" data-i18n="editor">Редактор</span>
      <div class="editor-header-actions">
        <label class="editor-header-btn btn-change-photo" id="btn-editor-change-photo" for="editor-file-input" title="Заменить фото" style="display:none;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/><path d="M16 5h6m-3-3v6"/></svg>
        </label>
        <button class="editor-header-btn btn-download" id="btn-editor-download" title="Скачать в оригинальном качестве">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button class="btn-editor-save" id="btn-editor-save" title="Сохранить изменения">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </button>
      </div>
    </header>

    <div class="editor-viewport" id="editor-viewport">
      <!-- Floating upload button for single photo editing mode -->
      <label class="editor-upload-btn" id="editor-upload-btn" for="editor-file-input">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        <span data-i18n="uploadPhoto">Выбрать фото</span>
      </label>
      <input type="file" id="editor-file-input" style="display: none;">

      <div class="editor-canvas-wrapper" id="editor-canvas-wrapper">
        <div class="editor-image-container" id="editor-image-container"></div>
      </div>
    </div>
  </div>

  <!-- Mobile Navigation Bar / Landscape Right Dock -->
  <div class="mobile-bottom-bar" id="mobile-dock">
    <a href="https://telegram.me/camtarssonai" target="_blank" rel="noopener noreferrer" class="mobile-tab-btn mobile-dock-tg" title="Telegram">
      <svg width="24" height="24" viewBox="0 0 36 36" fill="none">
        <circle cx="18" cy="18" r="18" fill="#24A1DE"/>
        <path d="M8.5 17.5L26.5 10.5L23.5 25.5L17.5 21L14.5 24V19.5L23 13.5L12.5 18.5L8.5 17.5Z" fill="white" stroke="white" stroke-width="0.5" stroke-linejoin="round"/>
      </svg>
      <span>TG</span>
    </a>
    <button class="mobile-tab-btn" id="btn-mobile-assets">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
      <span data-i18n="assets">АССЕТЫ</span>
